name: CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "Token for uploading test coverage to Codecov"
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.scss"
      - ".github/workflows/**"
      - ".eslint*"
      - ".stylelint*"
      - "package-lock.json"
      - "package.json"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.scss"
      - ".github/workflows/**"
      - ".eslint*"
      - ".stylelint*"
      - "package-lock.json"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer

      - name: Install dependencies
        run: |
          npm ci --workspaces --no-audit --ignore-scripts
          composer install
          npm run build

      - name: Run build
        run: npm run build

      - name: Run lint
        run: |
          npm run lint:scripts --workspaces --if-present
          npm run lint:styles --workspaces --if-present

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer

      - name: Install dependencies
        run: |
          npm ci --workspaces --no-audit --ignore-scripts
          composer install

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run typecheck --workspaces --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer

      - name: Install dependencies
        run: |
          npm ci --workspaces --no-audit --ignore-scripts
          composer install --prefer-dist

      - name: Run build
        run: npm run build

      - name: Run test
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
